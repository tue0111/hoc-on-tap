learning_objectives_course_level:
  evidence_status: OBSERVED
  source_id: src-0077
  locator: C0 slides 2 and 5
  after_intro:
    - Trình bày được cấu trúc môn học
    - Sắp xếp được kế hoạch học tập theo lịch trình
    - Xác định được yêu cầu môn học và kết quả người học phải đạt được
    - Hình thành thái độ học tập chủ động
  knowledge:
    - Phân biệt được các hình thức kinh doanh hiện nay và những đặc trưng riêng của mỗi loại hình
    - Tóm tắt được các điều kiện và thủ tục để Toà án tuyên bố một doanh nghiệp, hợp tác xã phá sản
    - Trình bày được các nội dung chính về hợp đồng thương mại
    - So sánh được cách thức giải quyết tranh chấp thương mại bằng con đường Tòa án và Trọng tài thương mại
  skills:
    - Thực hiện được các thủ tục pháp lý cơ bản trong kinh doanh
    - Xây dựng được cơ cấu quản lý đối với đơn vị kinh doanh trên cơ sở pháp luật
    - Áp dụng được qui định về giao kết và thực hiện hợp đồng khi giao dịch với các chủ thể khác
    - Vận dụng được qui định pháp luật khi cần chấm dứt hoạt động kinh doanh do mất khả năng thanh toán nợ
    - Lựa chọn được cách thức giải quyết tranh chấp thương mại phù hợp
  attitude:
    - Có tinh thần tôn trọng và chấp hành pháp luật trong hoạt động kinh doanh, cũng như các lĩnh vực khác trong đời sống xã hội

