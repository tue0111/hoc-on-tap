relationships:
  explicit_prerequisites:
    - target: "3.1 Tài khoản kế toán / phương trình kế toán"
      evidence: >
        "Trong bài học trước thì giữa Tài sản, Nợ phải trả, Vốn chủ sở hữu sẽ tồn tại
        sự cân đối được mô tả thông qua phương trình kế toán Tài Sản = Nợ Phải Trả +
        Vốn Chủ Sở Hữu."
      source_ref: src-0106
      confidence: high
      evidence_status: OBSERVED
    - target: "3.2 Ghi sổ kép"
      evidence: >
        "Với kiến thức đã học ở chương 2, chúng ta thấy mọi nghiệp vụ kinh tế phát sinh
        không làm thay đổi tính cân bằng của phương trình kế toán." Also "Ở chủ đề trước,
        chúng ta đã tìm hiểu các tài khoản chi tiết..."
      source_ref: src-0107
      confidence: high
      evidence_status: OBSERVED
    - target: "3.3 Tài khoản và bảng cân đối kế toán"
      evidence: >
        "trong các buổi học trước, chúng ta đã tìm hiểu về Tài khoản là gì, có mấy loại
        Tài khoản cũng như cách phản ánh nghiệp vụ phát sinh vào tài khoản theo nguyên
        tắc ghi sổ kép."
      source_ref: src-0108
      confidence: high
      evidence_status: OBSERVED
    - target: "3.4 Kiểm tra đối chiếu"
      evidence: >
        C3.2 states hệ quả ghi sổ kép leads to bảng tổng hợp tài khoản, "Phần kiến thức
        này chúng ta sẽ tìm hiểu ở chủ đề 3.4." C3.4 opens by recapping tài khoản, ghi sổ
        kép, and mối liên kết tài khoản–BCĐKT.
      source_ref: src-0107
      also_source_ref: src-0109
      confidence: high
      evidence_status: OBSERVED
    - target: "4.1 Bút toán điều chỉnh"
      evidence: >
        "Cơ sở dồn tích là một nguyên tắc kế toán quan trọng mà chúng ta đã tìm hiểu trong
        chương 2 báo cáo tài chính." Also requires kỳ kế toán and phù hợp to determine profit.
      source_ref: src-0115
      confidence: high
      evidence_status: OBSERVED
    - target: "4.2 Chi phí trả trước / doanh thu chưa thực hiện"
      evidence: >
        "Số tiền ghi nhận không phải là tổng số tiền đã chi trả trước... vì kế toán phải
        tuân thủ nguyên tắc phù hợp."
      source_ref: src-0110
      confidence: high
      evidence_status: OBSERVED
    - target: "4.3 Khấu hao TSCĐ"
      evidence: "Tài sản cố định được ghi nhận tăng theo nguyên tắc giá gốc."
      source_ref: src-0111
      confidence: high
      evidence_status: OBSERVED
    - target: "4.4 Doanh thu chưa thu tiền / chi phí chưa trả tiền"
      evidence: >
        "Doanh thu chưa thu tiền còn được gọi là doanh thu dồn tích vì được ghi nhận là
        doanh thu trong kỳ theo nguyên tắc cơ sở dồn tích." Chi phí chưa trả tiền also
        cites cơ sở dồn tích and phù hợp.
      source_ref: src-0112
      confidence: high
      evidence_status: OBSERVED
    - target: "4.5 Kết chuyển"
      evidence: >
        "Trước khi thực hiện bút toán kết chuyển, hãy nhớ lại các TK Doanh thu, TK thu mà
        chúng ta đã nghiên cứu ở chương 3." Also "ghi sổ kế toán phải tuân thủ nguyên tắc
        ghi sổ kép".
      source_ref: src-0113
      confidence: high
      evidence_status: OBSERVED
    - target: "4.6 Mối quan hệ tài khoản – BCTC"
      evidence: "Hãy cùng nhớ lại về báo cáo kết quả kinh doanh đã học ở chương 2."
      source_ref: src-0114
      confidence: high
      evidence_status: OBSERVED
    - target: "5.1 Ghi sổ từ chứng từ"
      evidence: >
        "Ghi sổ kế toán chính là công việc định khoản hay ghi sổ kép mà các anh chị đã
        được hướng dẫn ở chương 3."
      source_ref: src-0116
      confidence: high
      evidence_status: OBSERVED
    - target: "3.1 / 3.2 Tài khoản doanh thu (cơ sở dồn tích)"
      evidence: >
        "Theo nguyên tắc kế toán cơ sở dồn tích, doanh thu được ghi nhận dựa trên cơ sở
        nghiệp vụ kinh tế phát sinh, không dựa trên cơ sở thu tiền."
      source_ref: src-0106
      confidence: high
      evidence_status: OBSERVED
    - target: "3.1 Tài khoản giá vốn (nguyên tắc phù hợp)"
