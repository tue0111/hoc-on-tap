learning_objectives_course_level:
  source_c0_six:
    evidence_status: OBSERVED
    source_id: src-0033
    locator: C0 slide 2
    items:
      - Trang bị hiểu biết về mục tiêu, các loại hình tổ chức kinh doanh, các bên liên quan và các yếu tố môi trường ảnh hưởng đến hoạt động của tổ chức kinh doanh.
      - Cung cấp kiến thức cơ bản về cấu trúc doanh nghiệp, vai trò của quản trị doanh nghiệp và trách nhiệm xã hội của doanh nghiệp.
      - Trang bị kiến thức về nhiệm vụ, vai trò, chức năng của kế toán, các hoạt động đảm bảo và kiểm soát hệ thống thông tin cũng như ảnh hưởng của công nghệ tài chính đến hệ thống kế toán trong môi trường doanh nghiệp.
      - Giới thiệu các nội dung cơ bản và cách thức ứng dụng các lý thuyết quản lý và lãnh đạo trong doanh nghiệp.
      - Giới thiệu về các kỹ năng làm việc hiệu quả và truyền thông trong doanh nghiệp.
      - Xây dựng ý thức tuân thủ đạo đức nghề nghiệp của người hành nghề kế toán và kiểm toán cũng như hiểu biết về đạo đức trong kinh doanh.
  source_script_seven:
    evidence_status: OBSERVED
    source_id: src-0036
    locator: slides 5–12
    items:
      - Trang bị hiểu biết về mục tiêu, loại hình và các yếu tố môi trường ảnh hưởng của doanh nghiệp. (Ch.1)
      - Cung cấp kiến thức cơ bản về cấu trúc doanh nghiệp, vai trò của quản trị doanh nghiệp và trách nhiệm xã hội của doanh nghiệp. (Ch.2)
      - Trang bị kiến thức về nhiệm vụ, vai trò, chức năng của kế toán, kiểm toán và kiểm soát trong môi trường doanh nghiệp. (maps to Ch.3; Fintech not named here)
      - Giới thiệu các nội dung cơ bản và cách thức ứng dụng các lý thuyết quản lý và lãnh đạo trong doanh nghiệp. (Ch.4)
      - Giới thiệu về truyền thông và giải quyết mâu thuẫn trong doanh nghiệp. (maps to Ch.5)
      - Xây dựng ý thức tuân thủ đạo đức nghề nghiệp của người hành nghề kế toán và kiểm toán. (Ch.6)
      - Rèn luyện năng lực làm việc độc lập / Xây dựng định hướng phát triển nghề nghiệp của bản thân. (whole-course; not a numbered chapter)
    conflict_with_c0: >
      C0 lists 6 objectives aligned to 6 chapters. Script lists 7 (adds independent-work /
      career-orientation) and omits Fintech / đạo đức trong kinh doanh wording present in C0.

