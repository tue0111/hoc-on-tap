graph_id: concept-graph
version: "0.1.1"
layer: curriculum
status: skeleton
rule: >
  Every edge has source, edge_type, confidence, explicit_or_inferred.
  Sequential chapter numbering alone is inferred, never explicit.
  Do not import a Western textbook order that this corpus does not teach.
note: >
  NLKT teaches financial statements (C2) BEFORE accounts and double-entry (C3).
  The graph records that taught order. It does not rewrite it as
  Journal → Adjusting → Statements.

