scope: Chế độ kế toán HCSN, hiệu lực 01/01/2025, áp dụng từ năm tài chính 2025, thay
  TT 107/2017. TT 46/2025 (hiệu lực 01/07/2025) sửa điểm a khoản 1 Điều 2 (bỏ ngoại
  lệ UBND xã) để phù hợp chính quyền 2 cấp. Chưa thấy văn bản thay thế; danh sách
  sửa đổi có thể chưa đủ.
key_changes:
- text: TT 46/2025/TT-BTC sửa đổi, bổ sung, bãi bỏ các thông tư kế toán, kiểm toán
    theo chính quyền địa phương 2 cấp; hiệu lực 01/07/2025.
  source_url: https://chinhphu.vn/?docid=214192&pageid=27160
- text: 'Hỏi đáp BTC: khoản 1 Điều 2 TT 46/2025 bỏ cụm "trừ Ủy ban nhân dân xã" tại
    điểm a khoản 1 Điều 2 TT 24/2024.'
