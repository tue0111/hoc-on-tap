- id: ke-toan-thue-1
  name: Kế toán thuế 1
  codes:
  - ACCO2311
  tier: retrieval
  # W6b review M4: bare 'kế toán thuế' removed; it captured 'kế toán thuế TNDN hoãn lại' (KTTC3 ch.4).
  # Tax topics without a course name now reach this course through topic_owner suggestions.
  cues:
  - kế toán thuế 1
  - môn kế toán thuế
  - kt thuế 1
  - ktt1
  - acco2311
  # W6b G06: `cues` above are LABELS (course name/code/abbreviation) and win over topic cues of other
  # courses in the same question. `topic_cues` are business topics / study phrasing, used only when
  # no label matched. Never list bare 'kế toán thuế tndn' or 'thuế tndn hoãn lại' (KTTC3 ch.4).
  topic_cues:
  - kế toán thuế xuất khẩu
  - kế toán thuế nhập khẩu
  - kế toán thuế xuất nhập khẩu
  - kế toán thuế xnk
  - kế toán thuế đầu vào
  - kế toán thuế gtgt
  - kế toán thuế giá trị gia tăng
  - kế toán thuế tiêu thụ đặc biệt
  - kế toán thuế ttđb
  - kế toán thuế bảo vệ môi trường
  - kế toán thuế bvmt
  - ôn kế toán thuế
  - học kế toán thuế
  - bài kế toán thuế
  # a context cue directly followed by one of these is KTTC3 material, not Thuế 1
  topic_veto_after:
  - tndn
  - thuế thu nhập doanh nghiệp
  - thu nhập doanh nghiệp
  - thuế hoãn lại
  - hoãn lại
