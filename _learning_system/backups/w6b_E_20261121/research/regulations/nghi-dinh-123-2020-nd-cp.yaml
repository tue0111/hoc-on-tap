scope: NĐ 123/2020 về hóa đơn, chứng từ được sửa bởi NĐ 70/2025 (hiệu lực 01/06/2025),
  sau đó được thay bằng NĐ 254/2026/NĐ-CP về hóa đơn điện tử, chứng từ điện tử hướng
  dẫn Luật QLT 108/2025 (hiệu lực 01/07/2026). Quan hệ thay thế chỉ thấy ở nguồn phụ;
  nguồn chính thức xác nhận NĐ 254/2026 và ngày hiệu lực.
